{extend name="layout/admin" /}
{block name="content"}
<div class="card">
    <div class="card-title">
        <span>帮助内容管理</span>
        <a class="btn btn-primary" href="{:url('/admin/help/edit')}">＋ 新建帮助</a>
    </div>
    <table class="data-table">
        <thead>
        <tr><th>ID</th><th>标题</th><th>分类</th><th>排序</th><th>状态</th><th>更新时间</th><th>操作</th></tr>
        </thead>
        <tbody>
        {volist name="articles" id="a"}
        <tr>
            <td>{$a.id}</td>
            <td>{$a.title}</td>
            <td><span class="tag tag-blue">{$categories[$a->category] ?? $a.category}</span></td>
            <td>{$a.sort}</td>
            <td>{if condition="$a.status == 1"}<span class="tag tag-green">显示</span>{else /}<span class="tag tag-gray">隐藏</span>{/if}</td>
            <td class="muted">{$a.update_time}</td>
            <td>
                <a class="btn btn-sm" href="{:url('/admin/help/edit', ['id' => $a->id])}">编辑</a>
                <form method="post" action="{:url('/admin/help/delete', ['id' => $a->id])}" style="display:inline"
                      data-confirm="确认删除该帮助文章？">
                    <button class="btn btn-sm btn-red">删除</button>
                </form>
            </td>
        </tr>
        {/volist}
        </tbody>
    </table>
    <div class="pagination">{$articles|raw}</div>
</div>
{/block}
