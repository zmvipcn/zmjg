# ============================================================
# 逐梦记工 ThinkPHP 8 Nginx 站点配置
# 域名：zmjg.zmvip.cn
# 部署时请按服务器实际路径修改 root 与 PHP fastcgi 监听地址
# 宝塔/面板环境通常可直接粘贴到站点配置中
# ============================================================

server {
    listen       80;
    server_name  zmjg.zmvip.cn;

    # ThinkPHP 项目的网站运行目录必须指向 public
    # 注意：root 结尾必须是 /web/public。若只写到 /web，访问首页会返回 403
    # （nginx error log 会显示 directory index of ".../web/" is forbidden）
    root         /www/wwwroot/zmjg.zmvip.cn/web/public;
    index        index.php index.html;

    # 访问日志
    access_log   /var/log/nginx/zmjg.zmvip.cn.access.log;
    error_log    /var/log/nginx/zmjg.zmvip.cn.error.log;

    # 上传体积（APP安装包可能较大，按需要调整）
    client_max_body_size 200m;

    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
            break;
        }
    }

    # PHP 转发（二选一：socket 或 9000 端口，按服务器实际配置）
    location ~ \.php$ {
        fastcgi_pass   unix:/tmp/php-cgi-85.sock;
        # fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        include        fastcgi_params;
        # open_basedir 必须覆盖项目根目录（public 的上一级），否则无法加载
        # ../vendor、../app、../runtime 导致所有页面 500
        fastcgi_param  PHP_VALUE  "open_basedir=$document_root/../:/tmp/:/proc/";
    }

    # 禁止访问敏感文件
    location ~ ^/(\.env|\.git|composer\.(json|lock)|runtime) {
        deny all;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
    }
}

